<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order not found — Tailoring Needs</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}?v={{ sv }}" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .box { background: var(--surface); border: 2px solid var(--tl-brand); border-radius: var(--radius-lg);
           padding: 32px 28px; text-align: center; max-width: 360px; }
    h1 { color: var(--tl-brand); font-size: 20px; margin: 0 0 8px; }
    p  { font-size: 14px; color: var(--text-muted); margin: 0; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Order #{{ order_number }} not found</h1>
    <p>This tailoring order does not exist or the link is incorrect.
       Please contact Tailoring Needs — 9284630254.</p>
  </div>
</body>
</html>
