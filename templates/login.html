<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SHUBHAM NX Billing</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}?v={{ sv }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}?v={{ sv }}" />
  <script>
    /* Apply saved theme before paint to prevent white flash */
    (function () {
      var t = localStorage.getItem('snx-theme') || 'auto';
      if (t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  <style>
    /* Flat dark ground so signing in feels continuous with the app. Tokens,
       dark-mode overrides and the font stack all come from base.css. */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--brand-navy);
    }

    .login-wrap {
      width: 100%;
      max-width: 380px;
      padding: 20px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.28);
    }

    .login-body {
      padding: 2rem 2.25rem 2.25rem;
    }

    .login-logo-mark {
      width: 48px;
      height: 48px;
      background: var(--primary);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      margin: 0 auto 14px;
      letter-spacing: -0.3px;
    }

    .login-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      margin-bottom: 2px;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .form-group {
      margin-bottom: 0.875rem;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      min-height: 44px;
      font-size: 16px;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      color: var(--text);
      background: var(--bg);
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .form-group input:focus {
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.12);
    }

    .pw-wrap {
      position: relative;
    }

    .pw-wrap input {
      padding-right: 40px;
    }

    .pw-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }

    .pw-toggle:hover { color: var(--primary); }

    .btn-login {
      width: 100%;
      min-height: 42px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s;
    }

    .btn-login:hover {
      background: var(--primary-dark);
    }

    /* The error sits after the submit button and is the last form element */
    .login-body .alert {
      margin: 14px 0 0;
    }

    .login-footer {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 480px) {
      .login-body {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-body">
        <div class="login-logo-mark">SN</div>
        <div class="login-title">SHUBHAM NX</div>
        <div class="login-subtitle">Billing System &mdash; Sign In</div>

        <form method="POST" action="/login">
          <div class="form-group">
            <label for="login-username">Username</label>
            <input
              type="text"
              id="login-username"
              name="username"
              placeholder="Enter your username"
              autofocus
              autocomplete="username"
              required
            />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="pw-wrap">
              <input
                type="password"
                id="login-password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
              <button type="button" class="pw-toggle" id="toggle-password" aria-label="Show password">
                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-login">Sign In</button>

          {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
          {% endif %}
        </form>

        <div class="login-footer">SHUBHAM NX &mdash; Krishna Chowk, New Sangvi, Pune</div>
      </div>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('login-password');
    const eyeIcon = document.getElementById('eye-icon');

    const eyeOpen = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    const eyeClosed = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;

    toggleBtn.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      eyeIcon.innerHTML = isHidden ? eyeClosed : eyeOpen;
      toggleBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });
  </script>
</body>
</html>
