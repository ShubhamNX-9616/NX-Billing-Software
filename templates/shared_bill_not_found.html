<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bill Not Found — SHUBHAM NX</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}?v={{ sv }}" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .icon {
      color: var(--text-light);
      margin-bottom: 20px;
    }

    .heading {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }

    .message {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .bill-ref {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
      font-family: monospace;
    }

    .btn-home {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      padding: 11px 28px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
    }
    .btn-home:hover { background: var(--primary-dark); }

    .shop-name {
      margin-top: 28px;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="icon">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M16 16s-1.5-2-4-2-4 2-4 2"/>
        <line x1="9" y1="9" x2="9.01" y2="9"/>
        <line x1="15" y1="9" x2="15.01" y2="9"/>
      </svg>
    </div>

    <div class="heading">Bill Not Found</div>

    <p class="message">
      This bill link is invalid or the bill may have been deleted.
    </p>

    {% if bill_number %}
    <div class="bill-ref">{{ bill_number }}</div>
    {% endif %}

    <a href="/" class="btn-home">Go to Home</a>

    <div class="shop-name">SHUBHAM NX</div>

  </div>
</body>
</html>
